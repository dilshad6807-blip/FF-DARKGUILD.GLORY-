
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF-DARKGUILD.GLORY</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial;text-align:center;
}
header{padding:25px 10px;background:#190000;
 border-bottom:2px solid red}
h1{color:#ff2929}
.hero{padding:45px 15px}
.hero h2{font-size:32px;color:#ff2525}
.card{
 background:#191919;padding:20px;margin:15px;
 border:1px solid #6d1010;border-radius:14px;
}
input,button{
 width:100%;padding:14px;margin:8px 0;
 border-radius:8px;border:0;font-size:16px;
}
input{background:#292929;color:white}
button{background:#d90000;color:white;font-weight:bold}
footer{padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>FF-DARKGUILD.GLORY</h1>
<p>FREE FIRE GUILD WEBSITE</p>
</header>
<section class="hero">
<h2>10 MILLION+ GLORY</h2>
<p>Welcome to Dark Guild</p>
</section>
<div class="card">
<h2>GLORY TRACKER</h2>
<input id="guild" placeholder="Enter Guild ID">
<button onclick="track()">Check Guild</button>
<p id="result"></p>
</div>
<div class="card">
<h2>GLORY ORDER</h2>
<input placeholder="Enter Player ID">
<input type="number" placeholder="Enter Quantity">
<button onclick="alert('Please contact admin for authorized services')">Submit Order</button>
</div>
<footer>© 2026 FF-DARKGUILD.GLORY</footer>
<script>
function track(){
let id=document.getElementById("guild").value;
document.getElementById("result").innerText=
id ? "Guild ID: "+id+" — Records not connected yet." :
"Please enter Guild ID";
}
</script>
</body>
</html>
